<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>THE HOUSE — Night Visitor</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#eee;font-family:system-ui,Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh;background:#090909}
#hud{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;left:16px;top:14px;text-shadow:0 2px 8px #000;font-size:13px;letter-spacing:.08em}
#fearBox{position:absolute;right:16px;top:14px;width:130px}
#fearLabel{font-size:10px;letter-spacing:.15em;margin-bottom:5px;text-align:right}
#fear{height:6px;background:#292929;border-radius:5px;overflow:hidden}
#fearFill{height:100%;width:8%;background:#ddd;transition:width .15s}
#msg{position:absolute;left:50%;top:16%;transform:translateX(-50%);text-align:center;font-size:14px;opacity:0;transition:opacity .2s;text-shadow:0 2px 8px #000;white-space:nowrap}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);opacity:.6}
#cross:before,#cross:after{content:"";position:absolute;background:#ddd}
#cross:before{width:1px;height:18px;left:8px;top:0}#cross:after{height:1px;width:18px;left:0;top:8px}
#cross:after{height:1px;width:18px;left:0;top:8px}
#start,#end{position:fixed;inset:0;background:radial-gradient(circle at center,#171717,#020202 70%);display:flex;align-items:center;justify-content:center;z-index:20}
.panel{width:min(520px,88vw);text-align:center;padding:28px}
h1{font-size:34px;letter-spacing:.22em;margin:0 0 8px;font-weight:500}
.sub{opacity:.55;font-size:12px;letter-spacing:.18em;margin-bottom:28px}
p{opacity:.72;line-height:1.6;font-size:14px}
button{border:1px solid #555;background:#101010;color:#eee;padding:13px 25px;border-radius:8px;font-size:14px}
button:active{transform:scale(.97);background:#1d1d1d}
#controls{position:fixed;inset:0;pointer-events:none;z-index:10}
#move{position:absolute;left:18px;bottom:24px;width:154px;height:154px;border:1px solid #7776;border-radius:50%;background:#1117;pointer-events:auto;touch-action:none}
#move .knob{position:absolute;left:50%;top:50%;width:66px;height:66px;transform:translate(-50%,-50%);border-radius:50%;background:#ddd3;border:1px solid #aaa8}
#lookZone{position:absolute;right:0;top:0;width:57%;height:100%;pointer-events:auto;touch-action:none}
#lookHint{position:absolute;right:18px;bottom:194px;color:#aaa8;font-size:10px;letter-spacing:.12em;text-shadow:0 2px 6px #000;pointer-events:none}
.action{position:absolute;width:68px;height:68px;border-radius:50%;background:#151515cc;border:1px solid #8888;color:#eee;font-size:12px;pointer-events:auto;touch-action:none}
#run{right:28px;bottom:31px}
#flash{right:35px;bottom:112px;width:62px;height:62px}
@media(min-width:800px){#move,.action{opacity:.5}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="top">THE HOUSE · NIGHT 01</div>
  <div id="fearBox"><div id="fearLabel">FEAR</div><div id="fear"><div id="fearFill"></div></div></div>
  <div id="msg"></div>
  <div id="cross"></div>
</div>

<div id="controls">
  <div id="move"><div class="knob"></div></div>
  <div id="lookZone"></div>
  <div id="lookHint">SWIPE TO LOOK</div>
  <button class="action" id="flash">LIGHT</button>
  <button class="action" id="run">RUN</button>
</div>

<div id="start">
 <div class="panel">
  <h1>THE HOUSE</h1>
  <div class="sub">NIGHT VISITOR</div>
  <p>в доме кто-то есть.<br>найди ключ и доберись до выхода.<br>левый круг — движение · свайп справа — обзор</p>
  <button id="startBtn">НАЧАТЬ</button>
 </div>
</div>
<div id="end" style="display:none">
 <div class="panel">
  <h1 id="endTitle">YOU DIED</h1>
  <div class="sub" id="endSub">SHE FOUND YOU</div>
  <button onclick="location.reload()">СНОВА</button>
 </div>
</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

const map=[
"111111111111111",
"100000000000001",
"101111011111101",
"100001010000101",
"111101010110101",
"100001000010001",
"101111111011101",
"100000000000001",
"101111011111101",
"100001000000001",
"100101111111101",
"100100000000001",
"101111011111101",
"100000000000001",
"111111111111111"
];
const MW=map[0].length,MH=map.length;
function wall(x,y){return x<0||y<0||x>=MW||y>=MH||map[y][x]==='1'}

let player={x:1.7,y:1.7,a:0};
let monster={x:12.2,y:1.8,a:0,state:'wander',timer:0,seen:false};
let key={x:10.5,y:11.5,got:false};
let exit={x:13.3,y:13.4};
let fear=8, light=true, running=false, started=false, gameOver=false;
let keys={}; let last=performance.now(), flashMsg=0;
const FOV=Math.PI/3, MAX=18, STEP=0.018;

function say(t,ms=1800){const e=document.getElementById('msg');e.textContent=t;e.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>e.style.opacity=0,ms)}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function angleDiff(a,b){return Math.atan2(Math.sin(a-b),Math.cos(a-b))}
function blocked(x,y){return wall(Math.floor(x),Math.floor(y))}
function moveObj(o,dx,dy){
  const nx=o.x+dx,ny=o.y+dy;
  if(!blocked(nx,o.y)&&!blocked(nx+0.15*Math.sign(dx),o.y))o.x=nx;
  if(!blocked(o.x,ny)&&!blocked(o.x,ny+0.15*Math.sign(dy)))o.y=ny;
}
function los(ax,ay,bx,by){
 let dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy),n=Math.ceil(d/.08);
 for(let i=1;i<n;i++){let t=i/n;if(wall(Math.floor(ax+dx*t),Math.floor(ay+dy*t)))return false}
 return true;
}

function cast(rayAngle){
 let sin=Math.sin(rayAngle),cos=Math.cos(rayAngle);
 let d=0;
 while(d<MAX){
  d+=STEP;
  let x=player.x+cos*d,y=player.y+sin*d;
  if(wall(Math.floor(x),Math.floor(y))) {
   const fx=x-Math.floor(x),fy=y-Math.floor(y);
   const edge=Math.min(fx,1-fx,fy,1-fy);
   return {d:d*(Math.cos(angleDiff(rayAngle,player.a))||1),edge};
  }
 }
 return {d:MAX,edge:.5};
}

function render(){
 ctx.clearRect(0,0,W,H);
 // ceiling/floor
 let grad=ctx.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,'#08090b');grad.addColorStop(.49,'#151517');grad.addColorStop(.5,'#101010');grad.addColorStop(1,'#050505');
 ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

 const cols=Math.max(220,Math.floor(W/2));
 const step=W/cols;
 for(let i=0;i<cols;i++){
  const a=player.a-FOV/2+FOV*(i/cols);
  const hit=cast(a),d=Math.max(.08,hit.d);
  const h=Math.min(H*1.7,H*0.9/d);
  const y=(H-h)/2;
  const shade=Math.max(8,58-d*3.4);
  ctx.fillStyle=`rgb(${shade},${shade},${shade+2})`;
  ctx.fillRect(i*step,y,step+1,h);
  if(hit.edge<.12){ctx.fillStyle='rgba(120,120,120,.08)';ctx.fillRect(i*step,y,step+1,h)}
 }
 renderBillboard(key.x,key.y,'key');
 if(!key.got) renderBillboard(key.x,key.y,'key');
 if(!gameOver) renderMonster();
 // vignette / flashlight
 const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.12,W/2,H/2,Math.max(W,H)*.7);
 vg.addColorStop(0,light?'rgba(0,0,0,0)':'rgba(0,0,0,.5)');
 vg.addColorStop(.55,'rgba(0,0,0,.15)');
 vg.addColorStop(1,'rgba(0,0,0,.82)');
 ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

function project(wx,wy){
 let dx=wx-player.x,dy=wy-player.y,d=Math.hypot(dx,dy);
 let rel=angleDiff(Math.atan2(dy,dx),player.a);
 if(Math.abs(rel)>FOV*.68)return null;
 let sx=W/2+Math.tan(rel)/Math.tan(FOV/2)*W/2;
 return {sx,d,rel};
}
function renderBillboard(x,y,type){
 if(type==='key'&&key.got)return;
 const p=project(x,y); if(!p)return;
 const size=Math.min(H*.12,H/p.d*.16);
 if(p.d>9)return;
 ctx.save();ctx.translate(p.sx,H/2);
 ctx.fillStyle='#eee';ctx.shadowBlur=14;ctx.shadowColor='#fff';
 ctx.fillRect(-3,-size*.55,6,size*1.1);ctx.fillRect(-size*.18,-size*.18,size*.36,4);
 ctx.restore();
}

function renderMonster(){
 const p=project(monster.x,monster.y);
 if(!p || p.d>13 || !MONSTER_SPRITE.complete)return;
 const s=Math.min(H*1.45,H/p.d*1.22);
 const dw=s*0.63, dh=s;
 ctx.save();
 ctx.globalAlpha=Math.max(.18,Math.min(1,1-p.d/14));
 ctx.imageSmoothingEnabled=true;
 ctx.drawImage(MONSTER_SPRITE,p.sx-dw/2,H/2-dh*.53,dw,dh);
 ctx.restore();
}

function monsterAI(dt){
 const d=dist(player,monster);
 const sees= d<7 && los(monster.x,monster.y,player.x,player.y);
 if(sees){monster.seen=true}
 if(sees && (light||d<3.2)){
   monster.state='chase'; monster.timer=2.8;
 } else if(monster.timer>0){
   monster.timer-=dt; monster.state='chase';
 } else {
   monster.state='wander';
 }
 if(monster.state==='chase'){
   const a=Math.atan2(player.y-monster.y,player.x-monster.x);
   monster.a=a;
   const sp=0.75*dt*(running?1.02:1);
   moveObj(monster,Math.cos(a)*sp,Math.sin(a)*sp);
 }else{
   monster.a+=Math.sin(performance.now()/1200)*dt*.25;
   const tx=monster.x+Math.cos(monster.a)*.22*dt,ty=monster.y+Math.sin(monster.a)*.22*dt;
   if(!blocked(tx,ty)) {monster.x=tx;monster.y=ty}
   else monster.a+=Math.PI*.65;
 }
 if(d<1.0){die()}
 if(d<5) fear=Math.min(100,fear+(5-d)*dt*7);
 else fear=Math.max(4,fear-dt*3);
 if(sees && d<4) fear=Math.min(100,fear+dt*10);
 document.getElementById('fearFill').style.width=fear+'%';
}

function die(){
 if(gameOver)return;gameOver=true;
 document.getElementById('end').style.display='flex';
 document.getElementById('endTitle').textContent='YOU DIED';
 document.getElementById('endSub').textContent='SHE FOUND YOU';
}

function update(dt){
 if(!started||gameOver)return;
 let mx=0,my=0;
 if(keys.w||keys.ArrowUp)my+=1;if(keys.s||keys.ArrowDown)my-=1;
 if(keys.a)mx-=1;if(keys.d)mx+=1;
 let speed=(running?2.65:1.65)*dt;
 const ca=Math.cos(player.a),sa=Math.sin(player.a);
 moveObj(player,(ca*my-sa*mx)*speed,(sa*my+ca*mx)*speed);
 monsterAI(dt);
 if(!key.got && dist(player,key)<.6){key.got=true;say('🔑 КЛЮЧ НАЙДЕН');}
 if(key.got && dist(player,exit)<.8){win()}
 if(flashMsg>0)flashMsg-=dt;
}

function win(){gameOver=true;document.getElementById('end').style.display='flex';document.getElementById('endTitle').textContent='YOU ESCAPED';document.getElementById('endSub').textContent='THE HOUSE LET YOU GO... FOR NOW';}

function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;update(dt);render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='f')toggleLight();if(e.key==='Shift')running=true});
addEventListener('keyup',e=>{keys[e.key]=false;if(e.key==='Shift')running=false});

function toggleLight(){light=!light;say(light?'фонарик включён':'фонарик выключен',700)}
document.getElementById('startBtn').onclick=()=>{started=true;document.getElementById('start').style.display='none';say('найди ключ. и не шуми.',2200)};

function setupMove(){
 const el=document.getElementById('move'),kn=el.querySelector('.knob');
 let active=false;
 function pos(e){
   const r=el.getBoundingClientRect();
   return {x:e.clientX-r.left-r.width/2,y:e.clientY-r.top-r.height/2};
 }
 el.addEventListener('pointerdown',e=>{
   active=true; el.setPointerCapture(e.pointerId);
   e.preventDefault();
 });
 el.addEventListener('pointermove',e=>{
   if(!active)return;
   let p=pos(e),max=58,len=Math.hypot(p.x,p.y);
   if(len>max){p.x=p.x/len*max;p.y=p.y/len*max}
   kn.style.left=`calc(50% + ${p.x}px)`;
   kn.style.top=`calc(50% + ${p.y}px)`;
   const dead=10;
   keys.w=p.y<-dead;keys.s=p.y>dead;keys.a=p.x<-dead;keys.d=p.x>dead;
 });
 function up(){
   active=false;kn.style.left='50%';kn.style.top='50%';
   keys.w=keys.s=keys.a=keys.d=false;
 }
 el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}
setupMove();

const lookZone=document.getElementById('lookZone');
let lookActive=false,lastLookX=0,lastLookY=0;
lookZone.addEventListener('pointerdown',e=>{
  lookActive=true;lastLookX=e.clientX;lastLookY=e.clientY;
  lookZone.setPointerCapture(e.pointerId);e.preventDefault();
});
lookZone.addEventListener('pointermove',e=>{
  if(!lookActive)return;
  const dx=e.clientX-lastLookX,dy=e.clientY-lastLookY;
  lastLookX=e.clientX;lastLookY=e.clientY;
  player.a += dx*0.006;
  e.preventDefault();
});
function endLook(){lookActive=false}
lookZone.addEventListener('pointerup',endLook);
lookZone.addEventListener('pointercancel',endLook);

// tap LIGHT / RUN without interfering with camera swipes
document.getElementById('flash').addEventListener('pointerdown',e=>{e.stopPropagation();toggleLight()});
const runBtn=document.getElementById('run');
runBtn.addEventListener('pointerdown',e=>{e.stopPropagation();running=true;runBtn.setPointerCapture(e.pointerId)});
runBtn.addEventListener('pointerup',()=>running=false);
runBtn.addEventListener('pointercancel',()=>running=false);

say('','0');
</script>
